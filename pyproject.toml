[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn_mnist"
version = "0.1.0"
description = "CNN MNIST - DL Learning with PyTorch"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cnn_mnist*"]


[tool.ruff]
line-length = 150
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]
exclude = [".git", "__pycache__", "notebooks/"]


[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
